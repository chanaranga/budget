<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Body -->
  <ellipse cx="48" cy="58" rx="34" ry="28" fill="#f9a8c9" stroke="#e07aaa" stroke-width="2"/>
  <!-- Head -->
  <circle cx="82" cy="50" r="16" fill="#f9a8c9" stroke="#e07aaa" stroke-width="2"/>
  <!-- Ear -->
  <ellipse cx="78" cy="37" rx="5" ry="7" fill="#f472b6" stroke="#e07aaa" stroke-width="1.5"/>
  <!-- Snout -->
  <ellipse cx="95" cy="55" rx="7" ry="5" fill="#f472b6" stroke="#e07aaa" stroke-width="1.5"/>
  <circle cx="93" cy="54" r="1.5" fill="#be185d"/>
  <circle cx="97" cy="54" r="1.5" fill="#be185d"/>
  <!-- Eye -->
  <circle cx="86" cy="46" r="2" fill="#be185d"/>
  <!-- Coin slot on top -->
  <rect x="38" y="28" width="18" height="4" rx="2" fill="#be185d"/>
  <!-- Legs -->
  <rect x="25" y="82" width="10" height="12" rx="3" fill="#f472b6" stroke="#e07aaa" stroke-width="1.5"/>
  <rect x="40" y="82" width="10" height="12" rx="3" fill="#f472b6" stroke="#e07aaa" stroke-width="1.5"/>
  <rect x="55" y="82" width="10" height="12" rx="3" fill="#f472b6" stroke="#e07aaa" stroke-width="1.5"/>
  <!-- Tail -->
  <path d="M14 52 Q6 46 10 40 Q14 34 10 30" fill="none" stroke="#e07aaa" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Euro sign -->
  <text x="46" y="67" font-size="22" font-weight="bold" fill="#be185d" text-anchor="middle" font-family="Arial, sans-serif">€</text>
</svg>
